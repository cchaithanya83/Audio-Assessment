.kind{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.done-card{text-align:center;padding:40px 28px}

@media (max-width:620px){header{padding:10px 16px}.card{padding:18px}.lede h2{font-size:24px}main{padding-top:20px}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ---------------- Storage (IndexedDB, local only) ---------------- */
// Browser-local store: only used for the assessor's chosen download folder handle.
const LocalDB = {
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('audio-assess-hosted',1);
    r.onupgradeneeded=()=>{const d=r.result;['tests','submissions','kv'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const req=fn(t.objectStore(store));
    t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error)})},
  all(s){return this.tx(s,'readonly',st=>st.getAll())},
  get(s,id){return this.tx(s,'readonly',st=>st.get(id))},
  put(s,v){return this.tx(s,'readwrite',st=>st.put(v))},
  del(s,id){return this.tx(s,'readwrite',st=>st.delete(id))},
};

/* ---------------- Supabase data layer (same interface the app used for local storage) ---------------- */
let sb=null;
const REC_BUCKET='recordings',AUDIO_BUCKET='test-audio';
const strip=o=>{const{audio,audioUrl,...rest}=o;return rest}; // never put blobs/signed URLs in the database
async function must(p){const{data,error}=await p;if(error)throw error;return data}
const DB={
  async all(s){
    if(s==='tests')return isAdmin?(await must(sb.from('tests').select('doc'))).map(r=>r.doc):(await must(sb.rpc('candidate_tests')))||[];
    if(s==='submissions')return(await must(sb.from('submissions').select('doc').order('created_at',{ascending:false}))).map(r=>r.doc);
    return[];
  },
  async get(s,id){
    if(s==='kv'){if(id==='settings'){const r=await must(sb.from('settings').select('doc').eq('id','settings').maybeSingle());return r?.doc||null}return LocalDB.get('kv',id)}
    if(s==='tests'){
      const t=isAdmin?(await must(sb.from('tests').select('doc').eq('id',id).maybeSingle()))?.doc:await must(sb.rpc('candidate_test',{test_id:id}));
      if(t&&t.audioPath){const{data}=await sb.storage.from(AUDIO_BUCKET).createSignedUrl(t.audioPath,3*3600);t.audioUrl=data?.signedUrl}
      return t||null;
    }
    if(s==='submissions'){
      const sub=(await must(sb.from('submissions').select('doc').eq('id',id).maybeSingle()))?.doc;
      if(sub&&sub.audioPath){const{data}=await sb.storage.from(REC_BUCKET).download(sub.audioPath);if(data)sub.audio=data}
      return sub||null;
    }
  },
  async put(s,v){
    if(s==='kv'){if(v.id==='settings')return must(sb.from('settings').upsert({id:'settings',doc:v}));return LocalDB.put('kv',v)}
    if(s==='tests'){
      if(v.audio instanceof Blob){const path=`${v.id}/${Date.now()}_${slug(v.audioName||'audio')}`;
        await must(sb.storage.from(AUDIO_BUCKET).upload(path,v.audio,{contentType:v.audio.type||'audio/mpeg'}));
        if(v.audioPath&&v.audioPath!==path)sb.storage.from(AUDIO_BUCKET).remove([v.audioPath]);v.audioPath=path}
      return must(sb.from('tests').upsert({id:v.id,doc:strip(v)}));
    }
    if(s==='submissions'){
      if(v.audio instanceof Blob&&!v.audioPath){const ext=(v.audio.type.match(/audio\/(\w+)/)||[,'webm'])[1];
        const path=`${slug(v.testTitle)}/${stamp(v.submittedAt)}_${slug(v.name)}_${v.id}.${ext}`;
        await must(sb.storage.from(REC_BUCKET).upload(path,v.audio,{contentType:v.audio.type||'audio/webm'}));v.audioPath=path}
      const row={id:v.id,doc:strip(v)};
      // Candidates may only insert; assessors may update.
      return isAdmin?must(sb.from('submissions').upsert(row)):must(sb.from('submissions').insert(row));
    }
  },
  async del(s,id){
    const bucket=s==='submissions'?REC_BUCKET:AUDIO_BUCKET;
    const doc=(await must(sb.from(s).select('doc').eq('id',id).maybeSingle()))?.doc;
    if(doc?.audioPath)await sb.storage.from(bucket).remove([doc.audioPath]);
    return must(sb.from(s).delete().eq('id',id));
  },
};
async function checkAssessor(){
  const{data:{session}}=await sb.auth.getSession();if(!session){isAdmin=false;return false}
  const{data}=await sb.rpc('is_assessor');isAdmin=!!data;return isAdmin;
}
// Candidate upload with retry; if the network is down, hand the candidate local copies to give the assessor.
async function submitSafely(sub){
  for(;;){
    try{await DB.put('submissions',sub);return true}
    catch(e){
      if(confirm(`Your answer could not be uploaded (${e.message||e}).\n\nCheck your internet connection, then press OK to try again.\nPress Cancel to download a copy to give to the assessor.`))continue;
      downloadBlob(new Blob([JSON.stringify(strip(sub),null,2)],{type:'application/json'}),`submission_${slug(sub.name)}_${sub.id}.json`);
      if(sub.audio instanceof Blob)downloadBlob(sub.audio,`recording_${slug(sub.name)}_${sub.id}.webm`);
      return false;
    }
  }
}
const uploadingView=()=>setView('<div class="narrow"><div class="card done-card"><div class="spin"></div><h2>Submitting your answer…</h2><p class="muted">Please keep this page open.</p></div></div>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const fmtTime=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const fmtDate=t=>new Date(t).toLocaleString();

const DEFAULT_SETTINGS={id:'settings',pin:'admin123',wordWeight:40,fieldWeight:60,passMark:85,ignoreCase:false,ignorePunct:false,audioFormat:'wav',spkAccW:40,spkHardW:25,spkFluW:35};
const SAMPLE_TEXT=`Escalation summary prepared for supervisor review. The member disputed the coinsurance applied to a recent specialist claim and requested a full benefit re-verification. The representative confirmed that the servicing provider terminated its network agreement mid plan year, which moved the claim to the out of network tier.

Member Name: Rajesh Krishnamurthy
Date of Birth: 09/02/1987
Member ID: BCB4471TQ08
Policy Number: POL-7734029-AZ
Phone: (469) 555-0293
Email: rajesh.krishnamurthy@meridiancare.org
Servicing Provider: Crestline Orthopedic Associates
Network Status: Out of Network
Deductible: $2,000.00
Coinsurance: 40%
Specialist Copay: Not Applicable
Out-of-Pocket Maximum: $12,400.00
Original Authorization: PA-337482-M
Corrected Authorization: AUTH-52190-R
Reference Number: REF-40917AZ
Effective Date: 03/15/2026
Approved Amount: $2,918.75`;

const SAMPLE_SPEAK=`Thank you for calling member services. Before we review your claim, I would like to explain how your plan handles visits to *specialists*. When you receive care from a provider inside your network, you usually pay a fixed copay, and the plan covers most of the remaining cost. However, if the provider leaves the network during the plan year, any visit after that date may be processed at the out of network level. In that case, you may be *responsible* for a larger share of the bill, including *coinsurance* and any amount above the allowed charge.

I understand this can be frustrating, especially when you were not told about the change in advance. Many members only learn that a provider has left the network when the *explanation of benefits* arrives in the mail, and by then the visit has already taken place. Providers are expected to inform their patients when their agreement with the plan is ending, but that notice does not always reach everyone in time. Because of this, the plan has a process to look at situations like yours *individually* rather than applying the out of network rules *automatically*.

What I can do today is request a formal review of the claim, confirm the exact date the provider's agreement ended, and check whether you qualify for *continuity of care*. If you are in the middle of an active course of treatment, such as *physical therapy* after surgery, ongoing care for a serious condition, or a pregnancy, the plan may allow you to keep seeing the same provider at the in network rate for a limited period. This period is usually up to ninety days, although it can be longer in certain cases. Your provider's office may also need to send *supporting records*, so I will make a note on your file to request them.

While the review is in progress, you do not need to pay the balance shown on the provider's bill. I will place a hold on the account so that the amount is not sent to *collections*. The review normally takes between ten and fifteen business days. If the plan agrees that the claim should be processed at the in network level, it will be adjusted automatically, and both you and the provider will receive an updated statement showing the corrected amount. If the original decision is upheld, you will receive a letter that explains the reason and describes your right to file an *appeal*.

function steps(n){const L=['Your details','Instructions','Assessment','Done'];
  return`<div class="steps">${L.map((l,i)=>`<span class="${i+1===n?'on':i+1<n?'done':''}"><b>${i+1<n?'✓':i+1}</b>${l}</span>`).join('')}</div>`}

      <li>Time limit: <b>${t.timeLimit>0?t.timeLimit+' minutes':'none'}</b>. ${t.timeLimit>0?'Your answer is submitted automatically when the time runs out.':''}</li>

  // The click is a user gesture, so the browser can re-confirm folder access here if it lapsed.

function runSpeakTest(t,cand){
  const started=Date.now();let attempts=0,blurs=0,submitted=false,recording=false,srFailed=!SR_API;
  let confs=[],rec=null,mr=null,stream=null,chunks=[],finalText='',interim='',recStart=0,recDur=0,audioBlob=null,stopping=null;
  setView(`
  <div class="card">
    <div class="row"><h2 style="margin:0">${esc(t.title)}</h2><span class="spacer"></span><span class="muted small">${esc(cand.name)}</span>
      <span class="timer" id="timer">${t.timeLimit>0?fmtTime(t.timeLimit*60):'00:00'}</span></div>
    <p class="muted small" style="margin:6px 0 12px">Read the passage below aloud.</p>
    <div class="passage">${esc(plainText(t.text))}</div>
  </div>
  <div class="card">
    <div class="player">
      <button class="primary" id="recBtn">● Start recording</button>
      <span id="recStatus" class="small muted">Not recording</span><span class="spacer"></span>
      <span class="small muted" id="attCount"></span>
    </div>
    <label>${t.showLive!==false?'What the computer heard':'Status'}</label>
    <div class="live" id="live"><span class="muted">Your words will appear here as you speak.</span></div>
    <div class="row" style="margin-top:12px"><span class="small muted" id="wc"></span><span class="spacer"></span><button class="primary" id="submit" disabled>Submit recording</button></div>
  </div>`);
  const recBtn=$('#recBtn'),live=$('#live'),status=$('#recStatus');
  const ui=()=>{const left=t.maxPlays>0?t.maxPlays-attempts:Infinity;
    $('#attCount').textContent=t.maxPlays>0?`Attempts used: ${attempts} / ${t.maxPlays}`:`Attempts: ${attempts}`;
    recBtn.textContent=recording?'■ Stop':(attempts?'● Record again':'● Start recording');
    recBtn.disabled=!!stopping||(!recording&&left<=0);
    $('#submit').disabled=recording||!!stopping||!attempts;
    status.innerHTML=recording?'<span class="recdot"></span>Recording…':stopping?'Finishing…':attempts?`Recorded ${fmtTime(recDur)}`:'Not recording';
    const wc=finalText.trim().split(/\s+/).filter(Boolean).length;$('#wc').textContent=attempts?`${wc} words recognised`:''};
  const showLive=()=>{if(t.showLive===false){live.innerHTML=recording?'<span class="muted">Listening…</span>':'<span class="muted">Recording saved.</span>';return}
    live.innerHTML=esc(finalText)+'<span class="interim">'+esc(interim)+'</span>'||'<span class="muted">Listening…</span>';live.scrollTop=live.scrollHeight};
  function startSR(){
    rec=new SR_API();rec.lang=t.lang||'en-US';rec.continuous=true;rec.interimResults=true;
    rec.onresult=e=>{interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){finalText+=r[0].transcript.trim()+' ';if(r[0].confidence>0)confs.push(r[0].confidence)}else interim+=r[0].transcript}showLive()};
    rec.onerror=e=>{if(['not-allowed','service-not-allowed','network','language-not-supported'].includes(e.error)){srFailed=true;
      live.innerHTML=`<span class="muted">Speech-to-text unavailable (${esc(e.error)}). Keep reading: your audio is still being recorded for the assessor.</span>`}};
    rec.onend=()=>{if(recording&&!srFailed){try{rec.start()}catch{}}else if(rec._done)rec._done()};
    try{rec.start()}catch{}
  }
  async function start(){
    if(t.maxPlays>0&&attempts>=t.maxPlays)return;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
    catch(e){alert('Microphone access is needed for this assessment. Allow the microphone in your browser and try again.');return}
    attempts++;finalText='';interim='';confs=[];chunks=[];audioBlob=null;recording=true;recStart=Date.now();
    mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mr.start(1000);
    if(!srFailed)startSR();
    live.innerHTML='<span class="muted">Listening…</span>';ui();
  }
  function stop(){
    if(!recording)return stopping||Promise.resolve();
    recording=false;recDur=(Date.now()-recStart)/1000;
    const pMr=new Promise(res=>{mr.onstop=()=>{audioBlob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});res()};mr.stop()});
    const pSr=new Promise(res=>{if(!rec||srFailed)return res();rec._done=res;try{rec.stop()}catch{res()}setTimeout(res,3000)});
    stopping=Promise.all([pMr,pSr]).then(()=>{stream.getTracks().forEach(x=>x.stop());if(interim){finalText+=interim+' ';interim=''}stopping=null;showLive();ui()});
    ui();return stopping;
  }
  recBtn.onclick=()=>recording?stop():start();
  const onBlur=()=>{if(!submitted)blurs++};window.addEventListener('blur',onBlur);
  const onUnload=e=>{if(!submitted){e.preventDefault();e.returnValue=''}};window.addEventListener('beforeunload',onUnload);
  const tick=setInterval(()=>{const el=(Date.now()-started)/1000;const tm=$('#timer');if(!tm)return;
    if(recording)status.innerHTML=`<span class="recdot"></span>Recording… ${fmtTime((Date.now()-recStart)/1000)}`;
    if(t.timeLimit>0){const left=t.timeLimit*60-el;tm.textContent=fmtTime(left);tm.classList.toggle('low',left<=60);if(left<=0)finish(true)}
    else tm.textContent=fmtTime(el)},500);
  cleanup=()=>{clearInterval(tick);recording=false;try{rec&&rec.abort()}catch{}try{mr&&mr.state!=='inactive'&&mr.stop()}catch{}stream&&stream.getTracks().forEach(x=>x.stop());
    window.removeEventListener('blur',onBlur);window.removeEventListener('beforeunload',onUnload)};
  async function finish(auto){
    if(submitted)return;
    if(!auto&&!confirm('Submit your last recording? You cannot change it afterwards.'))return;
    submitted=true;await stop();
    const text=finalText.trim();
    const sub={id:uid(),kind:'speak',testId:t.id,testTitle:t.title,name:cand.name,cid:cand.cid,answer:text,asrOriginal:text,audio:audioBlob,recDur:Math.round(recDur),
      srAvailable:!srFailed,startedAt:started,submittedAt:Date.now(),durationSec:Math.round((Date.now()-started)/1000),plays:attempts,blurs,pasteAttempts:0,
      autoSubmitted:!!auto,finalScore:null,decision:'',notes:'',rubric:{}};
    uploadingView();
    let fl=null;if(audioBlob){try{fl=await analyzeAudio(audioBlob)}catch(e){console.warn('audio analysis failed',e)}}
    if(fl){const{segs,...m}=fl;sub.fluency=m}
    sub.asrConf=confs.length?Math.round(100*confs.reduce((a,b)=>a+b,0)/confs.length):null;
    const ev=speakEval(t.text,text,sub.fluency,sub.asrConf);applySpeak(sub,ev);const s={wordAcc:ev.r.wordAcc};
    const ok=await submitSafely(sub);
    setView(`<div class="narrow">${steps(4)}<div class="card done-card"><div class="done-icon">✓</div>
      ${ok?'':'<div class="notice">The upload failed. Your answer and recording were downloaded to this computer. Please give those files to the assessor.</div>'}
      <h2>${auto?'Time is up: your recording was submitted':'Recording submitted'}</h2>
      <p class="muted">Thank you, ${esc(cand.name)}. Your response has been recorded for review.</p>
      ${t.showResult?`<div class="stats" style="text-align:left"><div class="stat"><div class="v">${s.wordAcc}%</div><div class="k">Reading accuracy</div></div>
        <div class="stat"><div class="v">${sub.wpm??'-'}</div><div class="k">Words per minute</div></div></div>`:''}
      <p class="small muted" style="margin-top:18px">You can now close this page.</p></div></div>`);
  }
  $('#submit').onclick=()=>finish(false);
  ui();
}
function runTest(t,cand){
  if(isSpeak(t))return runSpeakTest(t,cand);
  const started=Date.now();let plays=0,blurs=0,pasteAttempts=0,submitted=false;
  setView(`
  <div class="card">
    <div class="row"><h2 style="margin:0">${esc(t.title)}</h2><span class="spacer"></span>
      <span class="muted small">${esc(cand.name)}</span>
      ${t.timeLimit>0?`<span class="timer" id="timer">${fmtTime(t.timeLimit*60)}</span>`:`<span class="timer" id="timer">00:00</span>`}</div>
    <div class="player" style="margin-top:14px">
      <button class="primary" id="pPlay">▶ Play</button>
      <button id="pPause" disabled>Pause</button>
      <div class="bar"><div id="pBar"></div></div>
      <span class="small muted" id="pCount"></span>
    </div>
  </div>
  <div class="card">
    <label for="ans" style="margin-top:0">Your transcription</label>
    <textarea id="ans" class="answer" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Start typing here…"></textarea>
    <div class="row" style="margin-top:12px"><span class="small muted" id="wc">0 words</span><span class="spacer"></span><button class="primary" id="submit">Submit answer</button></div>
  </div>`);
  const playBtn=$('#pPlay'),pauseBtn=$('#pPause'),bar=$('#pBar'),cnt=$('#pCount'),ans=$('#ans');
  const updCount=()=>{cnt.textContent=t.maxPlays>0?`Plays used: ${plays} / ${t.maxPlays}`:`Plays: ${plays}`;
    playBtn.disabled=(t.maxPlays>0&&plays>=t.maxPlays)||player.state!=='idle'};
  const player=(t.mode==='file'&&(t.audio||t.audioUrl)?new FilePlayer(t,{onProgress:p=>bar.style.width=(p*100)+'%',onEnd:()=>{pauseBtn.disabled=true;updCount()}})
    :new TTSPlayer(t,{onProgress:p=>bar.style.width=(p*100)+'%',onEnd:()=>{pauseBtn.disabled=true;updCount()}}));
  updCount();
  playBtn.onclick=()=>{if(t.maxPlays>0&&plays>=t.maxPlays)return;plays++;player.play();pauseBtn.disabled=!t.allowPause;pauseBtn.textContent='Pause';updCount();ans.focus()};
  pauseBtn.onclick=()=>{if(player.state==='playing'){player.pause();pauseBtn.textContent='Resume'}else if(player.state==='paused'){player.resume();pauseBtn.textContent='Pause'}ans.focus()};
  ans.addEventListener('paste',e=>{e.preventDefault();pasteAttempts++});
  ans.addEventListener('drop',e=>{e.preventDefault();pasteAttempts++});
  ans.addEventListener('input',()=>{$('#wc').textContent=(ans.value.trim().split(/\s+/).filter(Boolean).length)+' words'});
  const onBlur=()=>{if(!submitted)blurs++};window.addEventListener('blur',onBlur);
  const onUnload=e=>{if(!submitted){e.preventDefault();e.returnValue=''}};window.addEventListener('beforeunload',onUnload);
  const tick=setInterval(()=>{const el=(Date.now()-started)/1000;const tm=$('#timer');if(!tm)return;
    if(t.timeLimit>0){const left=t.timeLimit*60-el;tm.textContent=fmtTime(left);tm.classList.toggle('low',left<=60);if(left<=0)finish(true)}
    else tm.textContent=fmtTime(el)},500);
  cleanup=()=>{clearInterval(tick);player.stop();window.removeEventListener('blur',onBlur);window.removeEventListener('beforeunload',onUnload)};
  async function finish(auto){
    if(submitted)return;
    if(!auto&&!confirm('Submit your answer? You cannot change it afterwards.'))return;
    submitted=true;const text=ans.value;
    const sub={id:uid(),testId:t.id,testTitle:t.title,name:cand.name,cid:cand.cid,answer:text,startedAt:started,submittedAt:Date.now(),
      durationSec:Math.round((Date.now()-started)/1000),plays,blurs,pasteAttempts,autoSubmitted:!!auto,finalScore:null,decision:'',notes:''};
    // For uploaded-audio passages the answer key is never sent to the candidate, so scoring happens on the assessor side.
    const s=t.text?score(t.text,text,settings):null;sub.auto=s?.auto??null;sub.wordAcc=s?.wordAcc??null;sub.fieldAcc=s?.fieldAcc??null;
    uploadingView();const ok=await submitSafely(sub);
    setView(`<div class="narrow">${steps(4)}<div class="card done-card"><div class="done-icon">✓</div>
      ${ok?'':'<div class="notice">The upload failed. Your answer was downloaded to this computer. Please give that file to the assessor.</div>'}
      <h2>${auto?'Time is up: your answer was submitted':'Answer submitted'}</h2>
      <p class="muted">Thank you, ${esc(cand.name)}. Your response has been recorded for review.</p>
      ${t.showResult&&s?`<div class="stats" style="text-align:left"><div class="stat"><div class="v">${s.auto}%</div><div class="k">Score</div></div>
        <div class="stat"><div class="v">${s.wordAcc}%</div><div class="k">Word accuracy</div></div>
        ${s.fieldAcc!==null?`<div class="stat"><div class="v">${s.fieldCorrect}/${s.fields.length}</div><div class="k">Fields correct</div></div>`:''}</div>`:''}
      <p class="small muted" style="margin-top:18px">You can now close this page.</p></div></div>`);
  }
  $('#submit').onclick=()=>finish(false);
}

async function adminLogin(){
  if(await checkAssessor())return adminView('subs');
  setView(`<div class="card" style="max-width:420px;margin:24px auto 0"><h2>Assessor sign in</h2>
    <label>Email</label><input type="text" id="em" autocomplete="username">
    <label>Password</label><input type="password" id="pw" autocomplete="current-password">
    <p class="small muted">Assessor accounts are created in Supabase (Authentication → Users), and the email must be listed in the <span class="mono">assessors</span> table.</p>
    <div class="row"><span class="spacer"></span><button class="primary" id="lg" style="width:100%">Sign in</button></div></div>`);
  const go=async()=>{$('#lg').disabled=true;
    const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error){$('#lg').disabled=false;alert('Login failed: '+error.message);return}
    if(await checkAssessor())adminView('subs');
    else{await sb.auth.signOut();$('#lg').disabled=false;alert('This account is not an assessor. Add its email to the assessors table in Supabase.')}};
  $('#lg').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};$('#em').focus();
}
async function adminView(tab){
  if(!isAdmin)return home();
  setView(`<div class="tabs">
    <button class="${tab==='subs'?'on':''}" onclick="adminView('subs')">Submissions</button>
    <button class="${tab==='tests'?'on':''}" onclick="adminView('tests')">Audio passages</button>
    <button class="${tab==='settings'?'on':''}" onclick="adminView('settings')">Scoring & settings</button></div><div id="tab"></div>`);
  if(tab==='subs')renderSubs();if(tab==='tests')renderTests();if(tab==='settings')renderSettings();
}
function scorePill(v){if(v==null)return'<span class="pill miss">-</span>';return`<span class="pill ${v>=settings.passMark?'ok':v>=settings.passMark-15?'warn':'bad'}">${v}%</span>`}
async function renderSubs(){
  const subs=(await DB.all('submissions')).sort((a,b)=>b.submittedAt-a.submittedAt);
  const tests=await DB.all('tests');
  // Score anything the candidate's browser could not score (e.g. uploaded-audio passages, whose answer key stays server-side).
  for(const s of subs){if(s.wordAcc==null&&s.answer!=null){const t=tests.find(x=>x.id===s.testId);if(t){const r=score(t.text,s.answer,optsFor(t));
    s.auto=r.auto;s.wordAcc=r.wordAcc;s.fieldAcc=r.fieldAcc;DB.put('submissions',s).catch(()=>{})}}}
  const fst=await FS.status();const unsaved=subs.filter(s=>s.kind==='speak'&&s.audioPath&&!s.savedFile).length;
  const folderBar=!FS.supported?'':fst==='none'?`<div class="notice">Recordings are stored in Supabase. To also keep copies on this computer, <a href="#" onclick="adminView('settings');return false">choose a download folder</a>.</div>`
    :fst!=='granted'?`<div class="notice">The browser needs permission again to save into <b>${esc(FS.handle.name)}</b>. <button class="small" id="reconn">Reconnect folder</button></div>`
    :unsaved?`<div class="notice">${unsaved} recording(s) are not yet saved to <b>${esc(FS.handle.name)}</b>. <button class="small" id="saveAll">Save them now</button></div>`:'';
  $('#tab').innerHTML=`${folderBar}<div class="card">
    <div class="row" style="margin-bottom:10px"><h3 style="margin:0">Submissions (${subs.length})</h3><span class="spacer"></span>
      <select id="fTest" style="width:auto"><option value="">All assessments</option>${tests.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select>
      <button class="small" onclick="exportCSV()">Export CSV</button></div>
    ${subs.length?`<div style="overflow-x:auto"><table><thead><tr><th>Candidate</th><th>Assessment</th><th>Submitted</th><th>Time</th><th>Accuracy</th><th>Fields / Fluency</th><th>Auto</th><th>Final</th><th>Decision</th><th></th></tr></thead>
    <tbody id="subRows">${subs.map(s=>`<tr data-test="${s.testId}"><td><b>${esc(s.name)}</b><div class="small muted">${esc(s.cid)}</div></td><td>${esc(s.testTitle)}<div><span class="pill ${s.kind==='speak'?'warn':'miss'} kind">${s.kind==='speak'?'Read aloud':'Listen & type'}</span></div></td>
      <td class="small">${fmtDate(s.submittedAt)}</td><td>${fmtTime(s.durationSec)}${s.autoSubmitted?' <span class="pill warn">timeout</span>':''}</td>
      <td>${s.wordAcc}%</td><td>${s.kind==='speak'?(s.fluencyScore!=null?s.fluencyScore+'% fluency':'-'):(s.fieldAcc!=null?s.fieldAcc+'%':'-')}</td><td>${scorePill(s.auto)}</td><td>${s.finalScore!=null?scorePill(s.finalScore):'<span class="muted small">-</span>'}</td>
      <td>${s.decision?`<span class="pill ${s.decision==='Pass'?'ok':s.decision==='Fail'?'bad':'warn'}">${esc(s.decision)}</span>`:'<span class="muted small">Pending</span>'}</td>
      <td><button class="small primary" onclick="reviewSub('${s.id}')">Review</button></td></tr>`).join('')}</tbody></table></div>`
    :'<p class="muted">No submissions yet.</p>'}</div>`;
  if($('#reconn'))$('#reconn').onclick=async()=>{await FS.ensure(true);renderSubs()};
  if($('#saveAll'))$('#saveAll').onclick=()=>saveAllRecordings().then(renderSubs);
  const f=$('#fTest');if(f)f.onchange=()=>document.querySelectorAll('#subRows tr').forEach(r=>r.style.display=!f.value||r.dataset.test===f.value?'':'none');

function renderDiff(ops){
  let out='';
  for(const o of ops){
    if(o.t==='eq')out+=(o.r.hard?`<span class="hardok" title="Difficult word: correct">${esc(o.h.raw)}</span>`:esc(o.h.raw))+' ';
    else if(o.t==='sub')out+=`<span class="sub" title="Typed">${esc(o.h.raw)}</span><span class="exp" title="Expected">${esc(o.r.raw)}</span> `;
    else if(o.t==='del')out+=`<span class="del" title="Missing">${esc(o.r.raw)}</span> `;
    else out+=`<span class="ins" title="Extra">${esc(o.h.raw)}</span> `;
  }
  return out;
}

    ${r.fields.length?`<h3>Field check</h3><div style="overflow-x:auto"><table><thead><tr><th>Field</th><th>Expected</th><th>Typed</th><th>Result</th><th>Similarity</th></tr></thead><tbody>
      ${r.fields.map(f=>`<tr><td>${esc(f.key)}</td><td class="mono">${esc(f.value)}</td><td class="mono">${f.typed==null?'<span class="muted">-</span>':esc(f.typed)}</td><td>${statusPill[f.status]}</td><td>${f.sim}%</td></tr>`).join('')}

  const keepFluency=()=>{if(fl){const{segs,...m}=fl;s.fluency=m}};
  const rescoreWith=async txt=>{keepForm();s.answer=txt;keepFluency();applySpeak(s,speakEval(ref,txt,s.fluency,s.asrConf));

  if($('#rSaveF'))$('#rSaveF').onclick=async()=>{

  if($('#rRescore'))$('#rRescore').onclick=()=>rescoreWith($('#rTrans').value.trim());

async function saveAllRecordings(force=false){
  if(!(await FS.ensure(true))){alert('Choose a recordings folder first, and allow the browser to save there.');return}
  const subs=(await DB.all('submissions')).filter(s=>s.kind==='speak'&&(s.audio||s.audioPath)&&(force||!s.savedFile));let ok=0,fail=0;
  for(const s of subs){try{await saveRecording(s);ok++}catch(e){fail++}}
  alert(`Saved ${ok} recording(s) to "${FS.handle.name}".${fail?` ${fail} failed.`:''}`);
}
async function exportCSV(){
  const subs=(await DB.all('submissions')).sort((a,b)=>a.submittedAt-b.submittedAt);
  const cols=['name','cid','testTitle','kind','submittedAt','durationSec','plays','blurs','pasteAttempts','autoSubmitted','wordAcc','fieldAcc','wpm','recDur','hardAcc','fluencyScore','pronunciation','fluency','clarity','auto','finalScore','decision','notes','savedFile','answer'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const val=(s,c)=>c==='submittedAt'?new Date(s[c]).toISOString():c==='kind'?(s.kind==='speak'?'read-aloud':'listen-type')
    :c==='pronunciation'?s.rubric?.pron:c==='fluency'?s.rubric?.flu:c==='clarity'?s.rubric?.cla:s[c];
  const rows=[cols.join(',')].concat(subs.map(s=>cols.map(c=>q(val(s,c))).join(',')));
  const blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`assessment-results-${new Date().toISOString().slice(0,10)}.csv`;a.click();
}

    </div>
    <label class="check"><input type="checkbox" id="sCase" ${settings.ignoreCase?'checked':''}> Ignore upper/lower case</label>
    <label class="check"><input type="checkbox" id="sPunct" ${settings.ignorePunct?'checked':''}> Ignore punctuation in word accuracy (fields are always strict)</label>
    <h3 style="margin-top:20px">Read-aloud scoring</h3>
    <p class="small muted">Overall speaking score = weighted average of <b>reading accuracy</b> (words read correctly), <b>difficult words</b> (words marked with *asterisks* that were understood) and <b>fluency</b> (pace, long pauses, continuity, fillers and restarts, measured from the recording).</p>
    <div class="grid3">
      <div><label>Reading accuracy weight</label><input type="number" id="sA" min="0" value="${settings.spkAccW}"></div>
      <div><label>Difficult words weight</label><input type="number" id="sH" min="0" value="${settings.spkHardW}"></div>
      <div><label>Fluency weight</label><input type="number" id="sFl" min="0" value="${settings.spkFluW}"></div>
    </div>
    <h3 style="margin-top:20px">Assessor accounts</h3>
    <p class="small muted">Add assessors in Supabase: create the user under Authentication → Users, then add their email to the <span class="mono">assessors</span> table.</p>
    <div class="row" style="margin-top:16px"><button id="sRescore">Re-score all submissions</button><span class="spacer"></span><button class="primary" id="sSave">Save settings</button></div>
  </div>
  <div class="card" style="max-width:640px"><h3>Backup</h3><p class="small muted">Everything lives in this browser. Export a backup to move it to another computer.</p>
    <div class="row"><button id="bExp">Export backup (JSON)</button><label class="check" style="margin:0"><input type="file" id="bImp" accept=".json" style="display:none"><button onclick="$('#bImp').click()">Import backup</button></label></div>
    <p class="small muted">Uploaded audio files are not included in backups. Re-attach them after importing.</p></div>`;
  if($('#fPick'))$('#fPick').onclick=async()=>{try{await FS.pick();renderSettings()}catch(e){if(e.name!=='AbortError')alert('Could not use that folder: '+e.message)}};
  if($('#fRe'))$('#fRe').onclick=async()=>{await FS.ensure(true);renderSettings()};
  if($('#fAll'))$('#fAll').onclick=()=>saveAllRecordings(confirm('Re-save recordings that were already saved too?\n\nOK = save all, Cancel = only unsaved ones')).then(renderSettings);
  if($('#sFmt'))$('#sFmt').onchange=async e=>{settings.audioFormat=e.target.value;await DB.put('kv',settings)};
  $('#sSave').onclick=async()=>{Object.assign(settings,{wordWeight:+$('#sW').value||0,fieldWeight:+$('#sF').value||0,passMark:+$('#sP').value||0,
    ignoreCase:$('#sCase').checked,ignorePunct:$('#sPunct').checked,spkAccW:+$('#sA').value||0,spkHardW:+$('#sH').value||0,spkFluW:+$('#sFl').value||0});await DB.put('kv',settings);alert('Settings saved.')};
  $('#sRescore').onclick=async()=>{const subs=await DB.all('submissions');let n=0;for(const s of subs){const t=await DB.get('tests',s.testId);if(!t)continue;
    if(isSpeak(t))applySpeak(s,speakEval(t.text,s.answer,s.fluency,s.asrConf));
    else{const r=score(t.text,s.answer,optsFor(t));s.auto=r.auto;s.wordAcc=r.wordAcc;s.fieldAcc=r.fieldAcc}
    await DB.put('submissions',s);n++}alert(`Re-scored ${n} submission(s).`)};
  $('#bExp').onclick=async()=>{const tests=(await DB.all('tests')).map(({audio,...t})=>t);const data={version:1,exportedAt:new Date().toISOString(),settings,tests,submissions:await DB.all('submissions')};
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='assessment-backup.json';a.click()};
  $('#bImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());
    for(const t of d.tests||[]){const ex=await DB.get('tests',t.id);await DB.put('tests',{...t,audio:ex?.audio})}
    for(const s of d.submissions||[])await DB.put('submissions',s);alert(`Imported ${(d.tests||[]).length} passages and ${(d.submissions||[]).length} submissions.`)}catch(err){alert('Could not import: '+err.message)}};
}

/* ---------------- Boot ---------------- */
(async()=>{
  const cfg=window.PORTAL_CONFIG;
  const key=cfg&&(cfg.supabasePublishableKey||cfg.supabaseAnonKey); // anon key still accepted for older projects
  if(!cfg||!cfg.supabaseUrl||!key||/YOUR-PROJECT|PASTE/.test(cfg.supabaseUrl+key)){
    $('#app').innerHTML='<div class="card"><h2>Setup needed</h2><p>Open <b>config.js</b> and paste your Supabase project URL and publishable key. See README.md.</p></div>';return}
  if(/^sb_secret_/.test(key)){$('#app').innerHTML='<div class="card"><h2>Wrong key</h2><p>config.js contains a <b>secret</b> key. Never put a secret key in a web page. Replace it with the <b>publishable</b> key (sb_publishable_…) and rotate the secret key in Supabase.</p></div>';return}
  sb=window.supabase.createClient(cfg.supabaseUrl,key);
  await LocalDB.open();
  try{await getSettings()}catch(e){
    $('#app').innerHTML=`<div class="card"><h2>Cannot reach the database</h2><p class="muted mono">${esc(e.message||e)}</p>
      <p>Check that config.js is correct and that you ran <b>schema.sql</b> in the Supabase SQL editor. Free projects pause after a week without use. You can restore them from the Supabase dashboard.</p></div>`;return}
  await FS.load();await checkAssessor();home();
})();
async function addSamples(){
  await DB.put('tests',{id:'sample1',kind:'listen',created:Date.now(),title:'Claims escalation summary (sample)',text:SAMPLE_TEXT,mode:'tts',voiceURI:'',rate:0.85,gap:0.8,maxPlays:2,timeLimit:10,allowPause:true,showResult:false,active:true});
  await DB.put('tests',{id:'sample2',kind:'speak',created:Date.now()+1,title:'Read aloud: out-of-network explanation (sample)',text:SAMPLE_SPEAK,lang:'en-US',showLive:true,maxPlays:2,timeLimit:10,showResult:false,active:true});
  renderTests();
}
</script>
